name: Build Singapore Streets APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Bubblewrap TWA builder)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production PWA
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing key
        run: |
          mkdir -p twa
          keytool -genkey -v -keystore twa/android-keystore \
            -alias androidkeyalias -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Singapore Streets, O=SG Streets, C=SG"

      - name: Copy PWA files to TWA directory
        run: |
          cp -r dist/* twa/
          cp -r dist/.* twa/ 2>/dev/null || true

      - name: Create TWA manifest
        run: |
          cat > twa/twa-manifest.json << 'TWAEOF'
          {
            "packageId": "com.singapurasia.streets",
            "appVersionCode": 1,
            "appVersion": "1.0",
            "host": "singapore-streets.github.io",
            "startUrl": "./",
            "name": "Singapore Streets",
            "launcherName": "SG Streets",
            "display": "standalone",
            "orientation": "landscape",
            "themeColor": "#00ffff",
            "themeColorDark": "#00ffff",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#04111a",
            "backgroundColorDark": "#04111a",
            "enableNotifications": false,
            "splashScreenFadeOutDuration": 300,
            "minSdkVersion": 24,
            "iconUrl": "http://127.0.0.1:8123/icon.png",
            "signingKey": {
              "path": "android-keystore",
              "alias": "androidkeyalias"
            }
          }
          TWAEOF
          cat twa/twa-manifest.json

      - name: Install Android SDK Command-line Tools
        run: |
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          cd "$ANDROID_ROOT/cmdline-tools"
          curl -o sdk.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -o sdk.zip -d latest
          # Google zip has cmdline-tools/ sublayer; move contents up
          mv latest/cmdline-tools/* latest/ 2>/dev/null || true
          rmdir latest/cmdline-tools 2>/dev/null || true
          export PATH="$PATH:$ANDROID_ROOT/cmdline-tools/latest/bin"
          export ANDROID_SDK_ROOT="$ANDROID_ROOT"
          export ANDROID_HOME="$ANDROID_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Bubblewrap validates SDK path requires bin/ or tools/ at SDK root
          mkdir -p "$ANDROID_ROOT/bin" "$ANDROID_ROOT/tools"
          yes | sdkmanager --sdk_root="$ANDROID_ROOT" "platform-tools" "build-tools;36.1.0" "platforms;android-33"

      - name: Build APK (Release)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$HOME/android-sdk/cmdline-tools/latest/bin"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << CONFEOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT",
            "jdkVersion": 17
          }
          CONFEOF
          cat ~/.bubblewrap/config.json
          cd twa
          # Generate a real 1200x1200 PNG icon locally (no network / no rate limits)
          python3 - << 'PYEOF'
          import zlib, struct
          w = h = 1200
          r, g, b = 0, 0xff, 0xff  # cyan theme (#00ffff)
          row = b'\x00' + bytes([r, g, b]) * w
          raw = row * h
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          open('icon.png', 'wb').write(png)
          PYEOF
          file icon.png
          # Serve the icon over localhost so bubblewrap can fetch it reliably
          python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &
          ICON_SERVER_PID=$!
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8123/icon.png -o /dev/null && break
            sleep 0.5
          done
          # Regenerate the Android project from twa-manifest.json without version prompt
          BUBBLEWRAP_KEYSTORE_PASSWORD=android BUBBLEWRAP_KEY_PASSWORD=android bubblewrap update --skipVersionUpgrade
          # Safety net: fix any empty enableNotifications value left by the template
          sed -i -E 's/enableNotifications: *,/enableNotifications: false,/' app/build.gradle
          grep -n "enableNotifications:" app/build.gradle || true
          # Build release APK (checksum now exists so no prompts)
          BUBBLEWRAP_KEYSTORE_PASSWORD=android BUBBLEWRAP_KEY_PASSWORD=android bubblewrap build --release
          kill "$ICON_SERVER_PID" 2>/dev/null || true

      - name: Verify APK produced
        run: |
          echo "=== all APK files ==="
          find twa -name "*.apk" -type f || true
          # bubblewrap produces the final signed APK at twa/app-release-signed.apk
          ls -la twa/app-release-signed.apk || ls -la twa/app/build/outputs/apk/release/*.apk || exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: singapore-streets-apk
          path: |
            twa/app-release-signed.apk
            twa/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30