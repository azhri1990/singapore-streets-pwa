name: Build Singapore Streets APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Bubblewrap TWA builder)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production PWA
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing key
        run: |
          mkdir -p twa
          keytool -genkey -v -keystore twa/android-keystore \
            -alias androidkeyalias -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android \
            -dname "CN=Singapore Streets, O=SG Streets, C=SG"

      - name: Copy PWA files to TWA directory
        run: |
          cp -r dist/* twa/
          cp -r dist/.* twa/ 2>/dev/null || true

      - name: Create TWA manifest
        run: |
          cat > twa/twa-manifest.json << 'TWAEOF'
          {
            "packageId": "com.singapurasia.streets",
            "appVersionCode": 1,
            "appVersionName": "1.0",
            "host": "singapore-streets.github.io",
            "startUrl": "./",
            "name": "Singapore Streets",
            "launcherName": "SG Streets",
            "display": "standalone",
            "orientation": "landscape",
            "themeColor": "#00ffff",
            "themeColorDark": "#00ffff",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#04111a",
            "backgroundColorDark": "#04111a",
            "signingKey": {
              "path": "twa/android-keystore",
              "alias": "androidkeyalias"
            }
          }
          TWAEOF
          cat twa/twa-manifest.json

      - name: Install Android SDK Command-line Tools
        run: |
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          cd "$ANDROID_ROOT/cmdline-tools"
          curl -o sdk.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -o sdk.zip -d latest
          # Google zip has cmdline-tools/ sublayer; move contents up
          mv latest/cmdline-tools/* latest/ 2>/dev/null || true
          rmdir latest/cmdline-tools 2>/dev/null || true
          export PATH="$PATH:$ANDROID_ROOT/cmdline-tools/latest/bin"
          export ANDROID_SDK_ROOT="$ANDROID_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$ANDROID_ROOT" "platforms;android-33" "build-tools;33.0.2"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << 'EOF'
          {
            "jdkPath": "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.21-9/x64",
            "androidSdkPath": "/home/runner/android-sdk"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Build APK (Release)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$HOME/android-sdk/cmdline-tools/latest/bin"
          cd twa
          printf 'n\n' | bubblewrap build --release

      - name: Verify APK produced
        run: |
          find twa -name "*.apk" -type f
          ls -la twa/app/build/outputs/apk/release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: singapore-streets-apk
          path: twa/app/build/outputs/apk/release/*.apk
          retention-days: 30