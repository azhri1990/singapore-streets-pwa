name: Build Singapore Streets APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Bubblewrap TWA builder)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      
      - name: Build production PWA
        run: npm run build
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      
      - name: Create TWA manifest manually
        run: |
          mkdir -p twa
          cat > twa/twa-manifest.json << 'TWAEOF'
          {
            "packageId": "com.singapurasia.streets",
            "appVersionCode": 1,
            "appVersionName": "1.0",
            "host": "github.com",
            "startUrl": "http://localhost:8080",
            "name": "Singapore Streets",
            "launcherName": "SG Streets",
            "display": "standalone",
            "orientation": "portrait",
            "themeColor": "#00ffff",
            "themeColorDark": "#00ffff",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#04111a",
            "backgroundColorDark": "#04111a",
            "iconUrl": "http://localhost:8080/icon-512.png",
            "maskableIconUrl": "http://localhost:8080/icon-512.png",
            "signingKey": {
              "path": "/home/runner/work/singapore-streets-pwa/singapore-streets-pwa/twa/android-keystore",
              "alias": "androidkeyalias"
            }
          }
          TWAEOF
          sha256sum twa/twa-manifest.json > twa/manifest-checksum.txt
          cat twa/manifest-checksum.txt
      
      - name: Build APK (unsigned Debug)
        run: |
          cd twa && JAVA_HOME=$JAVA_HOME echo -e "n\n" | bubblewrap build --skip-signing
      
      - name: Verify APK produced
        run: |
          ls -la twa/app/build/outputs/apk/debug/*.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: singapore-streets-apk
          path: twa/app/build/outputs/apk/debug/*.apk
          retention-days: 30
