name: Build Singapore Streets APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Bubblewrap TWA builder)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production PWA
        run: |
          npm run build
          SIZE=$(du -sk dist/assets 2>/dev/null | cut -f1)
          echo "Asset bundle size: $SIZE KB"
          GZ=$(tar -czf - -C dist/assets . 2>/dev/null | wc -c | awk '{print int($1/1024)}')
          echo "Compressed JS assets: ${GZ} KB"
          # Enforce a realistic size ceiling for the JS asset bundle (Three.js game)
          if [ $SIZE -gt 3000 ]; then
            echo "::error::Asset bundle size exceeds 3000KB limit ($SIZE KB)"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p twa
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring persisted signing keystore from secrets"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > twa/android-keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "::warning::No KEYSTORE_BASE64 secret — generating an ephemeral key. APKs from this run cannot update previously installed builds."
            STORE_PASS=android
            KEY_PASS=android
            keytool -genkey -v -keystore twa/android-keystore \
              -alias androidkeyalias -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Singapore Streets, O=SG Streets, C=SG"
          fi
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          FINGERPRINT=$(keytool -list -v -keystore twa/android-keystore \
            -alias androidkeyalias -storepass "$STORE_PASS" \
            | awk '/SHA256:/{print $NF}' | tr -d ' ')
          echo "KEYSTORE_SHA256=$FINGERPRINT" >> "$GITHUB_ENV"
          mkdir -p public/.well-known
          cat > public/.well-known/assetlinks.json << ASLEOF
          [
            {
              "relation": [
                "delegate_permission/common.handle_all_urls",
                "delegate_permission/common.get_login_creds"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "com.singapurasia.streets",
                "sha256_cert_fingerprints": [
                  "$FINGERPRINT"
                ]
              }
            }
          ]
          ASLEOF
          cat public/.well-known/assetlinks.json
          echo "FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"

      - name: Copy PWA files to TWA directory
        run: |
          cp -r dist/* twa/
          cp -r dist/.* twa/ 2>/dev/null || true
          # Include public/ assets (manifest, sw, icons) that vite copies to dist/
          if [ -d public ]; then
            find public -mindepth 1 -maxdepth 1 -exec cp -r {} twa/ \; 2>/dev/null || true
          fi
          mkdir -p twa/.well-known
          if [ -f public/.well-known/assetlinks.json ]; then
            cp public/.well-known/assetlinks.json twa/.well-known/assetlinks.json
            echo "assetlinks.json included:"
            cat twa/.well-known/assetlinks.json
          fi

      - name: Create TWA manifest
        run: |
          # Bump appVersionCode so each CI run installs over the previous build
          APP_VERSION_CODE="${{ github.run_number }}"
          APP_VERSION_NAME="1.0"
          cat > twa/twa-manifest.json << TWAEOF
          {
            "packageId": "com.singapurasia.streets",
            "appVersionCode": $APP_VERSION_CODE,
            "appVersion": "$APP_VERSION_NAME",
            "host": "singapore-streets.github.io",
            "startUrl": "./",
            "name": "Singapore Streets",
            "launcherName": "SG Streets",
            "display": "standalone",
            "orientation": "landscape",
            "themeColor": "#00ffff",
            "themeColorDark": "#00ffff",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "backgroundColor": "#04111a",
            "backgroundColorDark": "#04111a",
            "enableNotifications": false,
            "splashScreenFadeOutDuration": 300,
            "minSdkVersion": 24,
            "iconUrl": "http://127.0.0.1:8123/icon.png",
            "signingKey": {
              "path": "android-keystore",
              "alias": "androidkeyalias"
            }
          }
          TWAEOF
          cat twa/twa-manifest.json

      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/android-sdk
          key: android-sdk-linux-cmdline-11076708-build-tools-36.1.0-platform-36

      - name: Install Android SDK Command-line Tools
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          cd "$ANDROID_ROOT/cmdline-tools"
          curl -o sdk.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -o sdk.zip -d latest
          # Google zip has cmdline-tools/ sublayer; move contents up
          mv latest/cmdline-tools/* latest/ 2>/dev/null || true
          rmdir latest/cmdline-tools 2>/dev/null || true
          export PATH="$PATH:$ANDROID_ROOT/cmdline-tools/latest/bin"
          export ANDROID_SDK_ROOT="$ANDROID_ROOT"
          export ANDROID_HOME="$ANDROID_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Bubblewrap validates SDK path requires bin/ or tools/ at SDK root
          mkdir -p "$ANDROID_ROOT/bin" "$ANDROID_ROOT/tools"
          # compileSdk/targetSdk in the generated project is 36
          yes | sdkmanager --sdk_root="$ANDROID_ROOT" "platform-tools" "build-tools;36.1.0" "platforms;android-36"

      - name: Build APK (Release)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$PATH:$HOME/android-sdk/cmdline-tools/latest/bin"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << CONFEOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT",
            "jdkVersion": 17
          }
          CONFEOF
          cat ~/.bubblewrap/config.json
          cd twa
          # Generate a real 1200x1200 PNG icon locally (no network / no rate limits)
          python3 - << 'PYEOF'
          import zlib, struct
          w = h = 1200
          r, g, b = 0, 0xff, 0xff  # cyan theme (#00ffff)
          row = b'\x00' + bytes([r, g, b]) * w
          raw = row * h
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw, 9))
          png += chunk(b'IEND', b'')
          open('icon.png', 'wb').write(png)
          PYEOF
          file icon.png
          # Serve the icon over localhost so bubblewrap can fetch it reliably
          python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &
          ICON_SERVER_PID=$!
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8123/icon.png -o /dev/null && break
            sleep 0.5
          done
          # Regenerate the Android project from twa-manifest.json without version prompt
          BUBBLEWRAP_KEYSTORE_PASSWORD=android BUBBLEWRAP_KEY_PASSWORD=android bubblewrap update --skipVersionUpgrade
          # Safety net: fix any empty enableNotifications value left by the template
          sed -i -E 's/enableNotifications: *,/enableNotifications: false,/' app/build.gradle
          grep -n "enableNotifications:" app/build.gradle || true
          # Build release APK (checksum now exists so no prompts)
          BUBBLEWRAP_KEYSTORE_PASSWORD=android BUBBLEWRAP_KEY_PASSWORD=android bubblewrap build --release
          kill "$ICON_SERVER_PID" 2>/dev/null || true

      - name: Verify APK produced
        run: |
          echo "=== all APK files ==="
          find twa -name "*.apk" -type f || true
          # bubblewrap produces the final signed APK at twa/app-release-signed.apk
          ls -la twa/app-release-signed.apk || ls -la twa/app/build/outputs/apk/release/*.apk || exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: singapore-streets-apk
          path: twa/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30