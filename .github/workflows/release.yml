name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Determine version
        id: version
        run: |
          # Use conventional commits to auto-increment version
          npx --yes -p conventional-commits-parser@3.0.0 \
            -- node -e "
            const { parse } = require('conventional-commits-parser');
            const { execSync } = require('child_process');
            const log = execSync('git log --pretty=format:\"%s\" origin/main..HEAD').toString().trim();
            const commits = log.split('\n').filter(Boolean);
            let major = 0, minor = 0, patch = 0;
            for (const c of commits) {
              const m = c.match(/^(\w+)(?:\(.+\))?!?: (.+)/);
              if (!m) continue;
              const type = m[1].toLowerCase();
              const desc = m[2];
              if (type === 'feat' && desc.includes('!')) major++;
              else if (type === 'feat') minor++;
              else if (type === 'fix') patch++;
              else if (type === 'breaking') major++;
            }
            const v = [major, minor, patch].map(n => n === 0 ? '' : n).join('.');
            console.log('VERSION=' + (v || '1.0.0'));
          " > /tmp/version.txt
          cat /tmp/version.txt
          source /tmp/version.txt
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          npx --yes -p conventional-changelog@5.0.0 \
            conventional-changelog --preset angular --output CHANGELOG.md 2>/dev/null || true
          echo "CHANGELOG_PATH=$PWD/CHANGELOG.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Singapore Streets v${{ steps.version.outputs.VERSION }}
          body_path: ${{ steps.changelog.outputs.CHANGELOG_PATH }}
          body: |
            ## 🎮 Singapore Streets — Release v${{ steps.version.outputs.VERSION }}

            ### What's New
            - See commit history for details
            - **DualSense PS5 controller support** — haptics, adaptive triggers, light bar
            - **TWA Android APK** — built via Bubblewrap, no Play Store required

            ### 📦 Download
            - **APK artifact**: `singapore-streets-apk` (from GitHub Actions)
            - **Web**: [GitHub Pages](https://azhri1990.github.io/singapore-streets-pwa/) (if enabled)

            ### 🎮 Controller Support
            - **DualSense (USB)**: Haptic feedback, adaptive triggers (L2/R2), light bar
            - **DualSense (Bluetooth)**: Standard Gamepad API (rumble, buttons)
            - **Keyboard**: WASD + mouse
            - **Mobile**: Touch controls

            ### 📱 Install
            1. Download the APK artifact from the Actions tab
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK
            4. Launch Singapore Streets from your app drawer
          files: |
            dist/index.html
            dist/assets/**
            public/manifest.json
            public/sw.js
            public/icon-192.png
            public/icon-512.png
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}